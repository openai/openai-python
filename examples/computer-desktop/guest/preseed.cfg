# Task-only Debian 12.13 ARM64 guest. /dev/vda is the sole writable
# virtual disk in the reviewed build argv; never supply a host device.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/enable boolean false
d-i hw-detect/load_firmware boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i passwd/make-user boolean false
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false
d-i time/zone string UTC
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string bp22 :: 538 538 538 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . 4000 8000 -1 ext4 $primary{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select bp22
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
tasksel tasksel/first multiselect
d-i base-installer/install-recommends boolean false
d-i pkgsel/include string xauth x11-utils scrot openbox chromium chromium-sandbox mousepad dbus-x11 python3 fonts-dejavu-core grub2-common grub-efi-arm64-bin
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true
d-i cdrom-detect/eject boolean false
d-i cdrom-detect/cdrom_device string /dev/sda
d-i cdrom-detect/cdrom_fs string iso9660
d-i cdrom-detect/hybrid boolean true
d-i preseed/early_command string anna-install apt-cdrom-setup
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
d-i preseed/late_command string /bin/sh /cdrom/bp22/finish-guest.sh
