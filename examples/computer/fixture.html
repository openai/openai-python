<!doctype html>
<meta charset="utf-8">
<title>Local computer tool exercise</title>
<style>
  body { margin: 48px; font: 20px system-ui; background: #fff; color: #161616; }
  input, button { font: inherit; padding: 10px; }
  #result { margin-top: 36px; }
</style>
<h1>Local computer tool exercise</h1>
<form id="form">
  <label for="name">Name</label>
  <input id="name" autocomplete="off" placeholder="Type a name">
  <button id="submit">Greet</button>
</form>
<p id="result" aria-live="polite">Waiting for a name.</p>
<script>
  document.querySelector('#form').addEventListener('submit', (event) => {
    event.preventDefault();
    document.querySelector('#result').textContent = 'Hello, ' + document.querySelector('#name').value + '!';
  });
</script>
