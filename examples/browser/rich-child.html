<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Owned rich read fixture</title>
    <style>
      body { margin: 12px; }
      input, select, button { margin: 8px; padding: 8px; }
    </style>
  </head>
  <body>
    <section data-record-id="INTERNAL_ROW_1207">
      <span id="name">Dispatch BP-1207</span>
      <button id="dispatch" aria-labelledby="name">Route</button>
      <label>Queue <select data-browser-field="queue"><option value="triage">Triage</option><option value="resolved">Resolved</option></select></label>
      <span data-browser-private>PRIVATE_CHILD_TEXT</span>
      <input type="password" aria-label="Never read" value="PRIVATE_CHILD_PASSWORD" />
    </section>
    <script>
      const row = document.querySelector('section');
      const button = document.querySelector('#dispatch');
      let last;
      function bind(id) {
        row.dataset.recordId = id;
        if (last) button.removeEventListener('click', last);
        last = () => fetch('/effect', { method: 'POST', body: JSON.stringify({ id, action: 'dispatch' }) });
        button.addEventListener('click', last);
      }
      bind('INTERNAL_ROW_1207');
      window.recycleRich = () => bind('INTERNAL_ROW_1208');
    </script>
  </body>
</html>
