<!doctype html>
<meta charset="utf-8">
<title>SYNTHETIC_PRIVATE title never enters state</title>
<style>
  body { font: 16px system-ui; margin: 32px; }
  button, input, select { display: block; margin: 12px; padding: 8px; }
  #cover { display: none; position: fixed; inset: 0; z-index: 999; background: white; }
  .offscreen { transform: translateY(1500px); }
</style>
<form id="row" data-record-id="case_a">
  <h1 id="identity">case_a</h1>
  <input id="name" data-browser-field="guest" aria-label="Name" value="fixture input">
  <select id="category" data-browser-field="team" aria-label="Category">
    <option value="standard">Standard</option>
    <option value="urgent">Urgent</option>
  </select>
  <button id="confirm" type="submit">Confirm</button>
  <button id="secondary" type="button">Secondary</button>
  <input type="password" aria-label="Private" value="SYNTHETIC_PRIVATE">
  <input type="file" aria-label="File">
  <input type="hidden" value="SYNTHETIC_PRIVATE">
</form>
<div id="cover"></div>
<script>
  const row = document.querySelector('#row');
  const nameField = document.querySelector('#name');
  const confirm = document.querySelector('#confirm');
  const secondary = document.querySelector('#secondary');
  window.revision = 0;
  window.preliminary = 0;
  function report(record, operation, value) {
    window.revision++;
    // The server is an independent oracle; the handler captures this frozen
    // record at installation and never looks up mutable row identity to act.
    return fetch('/effect', {
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({id:record.id, operation, value})
    });
  }
  window.installRecord = id => {
    const record = Object.freeze({id});
    row.dataset.recordId = id;
    document.querySelector('#identity').textContent = id;
    row.onsubmit = event => {
      event.preventDefault();
      report(record, 'submit', nameField.value);
    };
    secondary.onclick = () => report(record, 'click', '');
    nameField.oninput = () => report(record, 'input', nameField.value);
    document.querySelector('#category').oninput = event => report(record, 'select', event.target.value);
  };
  window.installRecord('case_a');
  // These demonstrate why an action that moves a pointer or focuses first is
  // unsafe after a precheck. Owned DOM actions never trigger them.
  window.armPreliminary = () => {
    const rebind = () => { window.preliminary++; window.installRecord('case_b'); };
    confirm.addEventListener('pointerover', rebind, {once:true});
    nameField.addEventListener('focus', rebind, {once:true});
    nameField.addEventListener('invalid', rebind, {once:true});
  };
</script>
