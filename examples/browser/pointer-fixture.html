<!doctype html>
<style>
  body {
    margin: 0;
    font: 18px sans-serif;
  }
  #record {
    position: absolute;
    left: 50px;
    top: 50px;
    width: 700px;
    height: 440px;
    background: #eee;
    border: 2px solid #252525;
  }
  #source,
  #zone,
  #menuTrigger,
  #action,
  #contextAction {
    position: absolute;
    height: 55px;
    width: 135px;
  }
  #source {
    top: 175px;
    left: 20px;
    background: #ffe1a8;
    cursor: grab;
  }
  #zone {
    top: 175px;
    left: 430px;
    background: #a9f0d0;
  }
  #menuTrigger {
    left: 40px;
    top: 20px;
  }
  #action {
    left: 40px;
    top: 82px;
  }
  #contextAction {
    left: 300px;
    top: 82px;
  }
  #receipt {
    position: absolute;
    left: 20px;
    bottom: 24px;
  }
  .off {
    display: none;
  }
</style>
<section id="record">
  <button id="menuTrigger">Open menu</button>
  <button id="action" role="menuitem" class="off">Select item</button
  ><button id="contextAction" role="menuitem" class="off">Context item</button>
  <div id="source" draggable="true">Card A</div>
  <div id="zone">Destination</div>
  <output id="receipt"></output>
</section>
<script>
  window.proof = { events: [], result: [], inject: '', movesAfterDown: 0 };
  const owned = document.querySelector('#record');
  const record = (e) =>
    window.proof.events.push({
      kind: e.type,
      which: e.target.id,
      buttons: e.buttons ?? 0,
      shift: e.shiftKey ?? false,
    });
  for (const kind of [
    'pointerdown',
    'pointerup',
    'mousemove',
    'keydown',
    'keyup',
    'dragstart',
    'dragover',
    'drop',
    'contextmenu',
  ])
    document.addEventListener(kind, record, true);
  menuTrigger.addEventListener('mouseenter', () => {
    action.classList.remove('off');
    receipt.textContent = 'Menu open';
  });
  menuTrigger.addEventListener('click', () => {
    action.focus();
  });
  action.addEventListener('click', () => {
    proof.result.push('menu');
    receipt.textContent = 'Menu selected';
  });
  action.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      action.classList.add('off');
      menuTrigger.focus();
      receipt.textContent = 'Menu closed';
    }
  });
  owned.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    contextAction.classList.remove('off');
    receipt.textContent = 'Context open';
  });
  contextAction.addEventListener('click', () => {
    proof.result.push('context');
    receipt.textContent = 'Context selected';
  });
  source.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', 'card-A');
    receipt.textContent = 'Dragging';
  });
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.style.background = '#61db98';
    receipt.textContent = 'Over zone';
  });
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    proof.result.push('dropped:' + e.dataTransfer.getData('text/plain'));
    receipt.textContent = 'Card A placed';
  });
  source.addEventListener('pointerdown', () => {
    if (proof.inject === 'replace') {
      const copy = owned.cloneNode(true);
      copy.addEventListener('click', () => proof.result.push('WRONG-REPLACEMENT'));
      copy.addEventListener('drop', () => proof.result.push('WRONG-DROP'));
      owned.replaceWith(copy);
    }
    if (proof.inject === 'cover') {
      const cover = document.createElement('div');
      cover.id = 'cover';
      Object.assign(cover.style, { position: 'fixed', inset: '0', background: 'white', zIndex: 100 });
      cover.addEventListener('click', () => proof.result.push('WRONG-COVER'));
      document.body.append(cover);
    }
  });
</script>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;

  }
  .tr {

  }
  .bl {
