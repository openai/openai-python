<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Local inspector form</title>
  <style>
    body {
      font: 20px system-ui;
      padding: 3rem;
    }
    label,
    input,
    button {
      font: inherit;
      margin: 1rem;
    }
    output {
      display: block;
    }
  </style>
  <main data-record-id="fixture">
    <label>Ready <input type="checkbox" aria-label="Ready" data-browser-field="ready" /></label>
    <button disabled>Unavailable</button>
    <label data-browser-private
      >Private <input aria-label="Private" value="PRIVATE_INSPECTOR_SENTINEL"
    /></label>
    <output aria-live="polite">No changes.</output>
  </main>
  <script>
    window.effectCount = 0;
    document.addEventListener('change', (event) => {
      effectCount += 1;
      document.querySelector('output').textContent = event.target.checked ? 'Ready.' : 'Not ready.';
    });
  </script>
</html>
