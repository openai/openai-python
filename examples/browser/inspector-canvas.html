<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Local coordinate exercise</title>
  <style>
    body {
      margin: 0;
      font: 20px system-ui;
      background: #f6f4ec;
    }
    main {
      margin: 0;
      width: 780px;
      height: 560px;
    }
    canvas {
      display: block;
      background: #e2ece3;
    }
    output {
      display: block;
      padding: 1rem;
    }
  </style>
  <main id="workspace" data-record-id="fixture">
    <canvas id="board" width="780" height="480" aria-label="Coordinate board"></canvas>
    <output>Hover over the blue area.</output>
  </main>
  <script>
    const board = document.querySelector('#board');
    const ctx = board.getContext('2d');
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(510, 270, 120, 90);
    ctx.fillStyle = 'white';
    ctx.font = '20px system-ui';
    ctx.fillText('Menu', 538, 320);
    window.coordinateProof = { opened: false, clicks: 0, held: 0 };
    board.addEventListener('mousemove', (event) => {
      coordinateProof.held = event.buttons;
      coordinateProof.opened =
        event.clientX >= 510 && event.clientX < 630 && event.clientY >= 270 && event.clientY < 360;
      document.querySelector('output').textContent = coordinateProof.opened
        ? 'Menu open'
        : 'Hover over the blue area.';
    });
    board.addEventListener('click', (event) => {
      if (coordinateProof.opened) coordinateProof.clicks += 1;
    });
  </script>
</html>
