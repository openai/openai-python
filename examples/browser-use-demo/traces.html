<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldwork | Saved trace viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f0;
        --ink: #20251e;
        --muted: #585e54;
        --line: #d0d3ca;
        --card: #fff;
        --accent: #215b39;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181b18;
          --ink: #e8eee5;
          --muted: #b5bbb0;
          --line: #424a40;
          --card: #222822;
          --accent: #91cf9d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font:
          16px/1.55 system-ui,
          sans-serif;
        margin: 0;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1.4rem;
        flex-wrap: wrap;
        padding: 1rem 4vw;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 1.45rem;
        margin: 0;
      }
      a {
        color: var(--accent);
      }
      main {
        padding: 1.5rem 4vw;
        max-width: 1450px;
        margin: auto;
      }
      .notice {
        color: var(--muted);
        max-width: 80ch;
      }
      .choices {
        display: flex;
        align-items: end;
        gap: 1rem;
        flex-wrap: wrap;
        margin: 1.2rem 0;
      }
      label {
        display: grid;
        gap: 0.35rem;
      }
      select,
      button {
        font: inherit;
        padding: 0.45rem 0.75rem;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.3rem;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(14rem, 26rem) minmax(0, 1fr);
        gap: 1rem;
        align-items: start;
      }
      section {
        background: var(--card);
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }
      h2 {
        font-size: 1.1rem;
      }
      #timeline {
        display: grid;
        gap: 0.35rem;
        padding: 0;
        list-style: none;
        max-height: 72vh;
        overflow: auto;
      }
      #timeline button {
        text-align: left;
        width: 100%;
      }
      #timeline button[aria-current='true'] {
        border: 2px solid var(--accent);
        color: var(--accent);
      }
      #frame {
        width: 100%;
        height: auto;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          14px/1.6 ui-monospace,
          monospace;
      }
      #status,
      #detail-note {
        color: var(--muted);
      }
      @media (max-width: 680px) {
        .grid {
          grid-template-columns: 1fr;
        }
        #timeline {
          max-height: 34vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Fieldwork · Saved trace</h1>
      <span>VIEW ONLY</span><a href="/">Return to live dashboard</a>
    </header>
    <main>
      <p class="notice">
        This evidence stays on this computer. It can include synthetic page values and images. This viewer
        cannot run a tool or approve an action. Choose a capture ID when starting the server.
      </p>
      <div class="choices">
        <label
          >Recording<select id="trace">
            <option value="">Choose a saved run</option>
          </select></label
        >
        <button id="reload">Refresh recordings</button>
      </div>
      <p id="status" role="status" aria-live="polite">Opening saved traces…</p>
      <div class="grid">
        <section aria-labelledby="events-title">
          <h2 id="events-title">Timeline</h2>
          <ol id="timeline"></ol>
        </section>
        <section aria-labelledby="detail-title">
          <h2 id="detail-title">Select an event</h2>
          <p id="detail-note"></p>
          <img id="frame" hidden alt="Saved pixels from the isolated synthetic environment" />
          <pre id="detail"></pre>
        </section>
      </div>
    </main>
    <script nonce="__NONCE__">
      const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
      history.replaceState(null, '', location.pathname + location.search);
      // Reopening the private link may change only the fragment of this same document.
      addEventListener('hashchange', () => {
        if (new URLSearchParams(location.hash.slice(1)).has('token')) location.reload();
      });
      if (token) document.querySelector('a[href="/"]').hash = new URLSearchParams({ token }).toString();
      const el = (id) => document.getElementById(id);
      let imageURL,
        selection = 0,
        generation = 0;
      async function read(url) {
        const reply = await fetch(url, { headers: { 'X-Demo-Token': token }, cache: 'no-store' });
        if (!reply.ok) {
          const value = await reply.json();
          throw new Error(value.error || 'Saved item unavailable.');
        }
        return reply;
      }
      function clearDetail() {
        generation += 1;
        if (imageURL) URL.revokeObjectURL(imageURL);
        imageURL = undefined;
        el('frame').hidden = true;
        el('frame').removeAttribute('src');
        el('detail').textContent = '';
        el('detail-note').textContent = '';
      }
      async function show(traceId, selected, record, index) {
        if (selected !== selection || traceId !== el('trace').value) return;
        clearDetail();
        const version = generation;
        for (const button of el('timeline').querySelectorAll('button')) {
          button.setAttribute('aria-current', String(Number(button.dataset.index) === index));
        }
        el('detail-title').textContent = `${record.kind} · ${record.atMs} ms`;
        el('detail').textContent = JSON.stringify(record.data, null, 2);
        if (record.kind !== 'frame') return;
        el('detail-note').textContent = 'Loading saved frame…';
        try {
          const reply = await read(
            `/api/trace-frame?trace=${encodeURIComponent(traceId)}&frame=${encodeURIComponent(record.data.sequence)}`,
          );
          const blob = await reply.blob();
          if (version !== generation) return;
          imageURL = URL.createObjectURL(blob);
          el('frame').src = imageURL;
          el('frame').hidden = false;
          el('detail-note').textContent =
            `${record.data.role} · ${record.data.owner} · saved frame ${record.data.sequence}`;
        } catch (error) {
          if (version === generation) el('detail-note').textContent = error.message;
        }
      }
      async function openTrace() {
        const selected = ++selection;
        const traceId = el('trace').value;
        clearDetail();
        el('timeline').replaceChildren();
        el('detail-title').textContent = 'Select an event';
        if (!traceId) {
          el('status').textContent = 'Choose a saved run.';
          return;
        }
        el('status').textContent = 'Loading recording…';
        try {
          const data = await (await read(`/api/trace?trace=${encodeURIComponent(traceId)}`)).json();
          if (selected !== selection || traceId !== el('trace').value) return;
          const loaded = data.records;
          const frames = loaded.filter((item) => item.kind === 'frame');
          const summary = loaded.findLast((item) => item.kind === 'capture')?.data;
          el('status').textContent =
            `${loaded.length} events · ${frames.length} saved frames · ${summary?.omittedFrames ?? 0} frames omitted · ${summary?.omitted ?? 0} events omitted. ${data.incomplete ? 'Recording incomplete or still active.' : 'Recording complete.'}${frames.length ? '' : ' No saved frames.'}`;
          el('timeline').replaceChildren(
            ...loaded.map((record, index) => {
              const li = document.createElement('li');
              const button = document.createElement('button');
              button.dataset.index = String(index);
              button.textContent = `${record.atMs} ms · ${record.kind}${record.kind === 'frame' ? ' · ' + record.data.role : ''}`;
              button.setAttribute('aria-current', 'false');
              button.addEventListener('click', () => show(traceId, selected, record, index));
              li.append(button);
              return li;
            }),
          );
        } catch (error) {
          if (selected === selection && traceId === el('trace').value)
            el('status').textContent = error.message;
        }
      }
      async function list() {
        if (el('reload').disabled) return;
        el('reload').disabled = true;
        const selected = selection;
        const previous = el('trace').value;
        try {
          const data = await (await read('/api/traces')).json();
          if (selected !== selection || previous !== el('trace').value) return;
          const placeholder = new Option('Choose a saved run', '');
          el('trace').replaceChildren(placeholder, ...data.traces.map((id) => new Option(id, id)));
          if (data.traces.includes(previous)) el('trace').value = previous;
          el('status').textContent = `${data.capture} · ${data.traces.length} recordings.`;
          if (el('trace').value) await openTrace();
        } catch (error) {
          if (selected === selection && previous === el('trace').value)
            el('status').textContent = error.message;
        } finally {
          el('reload').disabled = false;
        }
      }
      el('trace').addEventListener('change', openTrace);
      el('reload').addEventListener('click', list);
      if (token) {
        list();
      } else {
        el('trace').disabled = true;
        el('reload').disabled = true;
        el('status').textContent =
          'Open the private link shown in the server terminal. After reload, reopen that link.';
      }
    </script>
  </body>
</html>
