<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fieldwork / Notes</title>
    <style>
      body {
        margin: 0;
        background: #f7f9f4;
        color: #263929;
        font:
          16px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      header,
      main {
        max-width: 680px;
        margin: auto;
        padding: 35px;
      }
      header {
        border-bottom: 1px solid #dce4d7;
        display: flex;
        justify-content: space-between;
      }
      a {
        color: #345c3b;
        margin-left: 20px;
      }
      h1 {
        font-size: 40px;
        line-height: 1.1;
        font-weight: 540;
      }
      .note {
        background: white;
        border: 1px solid #dce4d7;
        border-radius: 9px;
        padding: 22px;
      }
      small {
        color: #667964;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Fieldwork / Notes</strong>
      <nav><a href="brief">Brief</a><a href="rules">Rules</a></nav>
    </header>
    <main>
      <small>Isolated task notes</small>
      <h1 id="heading"></h1>
      <div class="note">
        <strong id="task"></strong>
        <p id="details"></p>
      </div>
      <p>Switch to the Task tab to edit the form. Notes never submit a task.</p>
    </main>
    <script>
      const notes = __NOTES__;
      document.getElementById('heading').textContent = notes.section;
      document.getElementById('task').textContent = notes.title;
      document.getElementById('details').textContent = notes.text;
    </script>
  </body>
</html>
