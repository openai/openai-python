name: CI
on:
  pull_request:
    branches:
      - main
      - next
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  detect_breaking_changes:
    runs-on: 'ubuntu-latest'
    name: detect-breaking-changes
    if: github.repository == 'openai/openai-python' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      FETCH_DEPTH: 0
    steps:
      - name: Calculate fetch-depth
        if: github.event_name == 'pull_request'
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          echo "FETCH_DEPTH=$((PR_COMMITS + 1))" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Ensure the comparison base is available to the scripts below.
          fetch-depth: ${{ env.FETCH_DEPTH }}

      - name: Set up Rye
        uses: eifinger/setup-rye@c694239a43768373e87d0103d7f547027a23f3c8
        with:
          version: '0.44.0'
          enable-cache: true
      - name: Install dependencies
        run: |
          rye sync --all-features
      - name: Detect removed symbols
        run: |
          rye run python scripts/detect-breaking-changes.py "$BASE_SHA"

      - name: Detect breaking changes
        run: |
          test -f ./scripts/detect-breaking-changes || { echo "Missing scripts/detect-breaking-changes"; exit 1; }
          ./scripts/detect-breaking-changes "$BASE_SHA"

  agents_sdk:
    runs-on: 'ubuntu-latest'
    name: Detect Agents SDK regressions
    if: github.repository == 'openai/openai-python' && github.event_name == 'pull_request'
    steps:
      # Setup this sdk
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: openai-python

      - name: Check out the base SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: openai-python-base

      # Setup the agents lib
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: openai/openai-agents-python
          path: openai-agents-python

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Detect Agents SDK regressions
        working-directory: openai-agents-python
        env:
          BASE_SDK: ../openai-python-base
          PR_SDK: ../openai-python
        run: |
          base_errors="$RUNNER_TEMP/agents-base-mypy.jsonl"
          pr_errors="$RUNNER_TEMP/agents-pr-mypy.jsonl"

          run_mypy() {
            local label="$1"
            local output="$2"
            local status

            set +e
            uv run mypy src -O json > "$output"
            status=$?
            set -e

            sed '/^[[:space:]]*$/d' "$output" > "$output.normalized"
            mv "$output.normalized" "$output"

            if (( status > 1 )) || { (( status == 1 )) && [[ ! -s "$output" ]]; }; then
              echo "::error::The Agents SDK $label check failed unexpectedly (mypy exit $status)."
              exit "$status"
            fi
          }

          uv add "$BASE_SDK"
          make sync
          run_mypy baseline "$base_errors"

          uv add "$PR_SDK"
          make sync
          run_mypy PR "$pr_errors"

          LC_ALL=C sort -u "$base_errors" > "$RUNNER_TEMP/agents-base-mypy.sorted"
          LC_ALL=C sort -u "$pr_errors" > "$RUNNER_TEMP/agents-pr-mypy.sorted"
          comm -13 \
            "$RUNNER_TEMP/agents-base-mypy.sorted" \
            "$RUNNER_TEMP/agents-pr-mypy.sorted" \
            > "$RUNNER_TEMP/agents-new-mypy-errors.jsonl"

          if [[ -s "$RUNNER_TEMP/agents-new-mypy-errors.jsonl" ]]; then
            echo '::error::The PR adds Agents SDK type-checking errors beyond the existing baseline.'
            cat "$RUNNER_TEMP/agents-new-mypy-errors.jsonl"
            exit 1
          fi

          echo '::notice::The PR introduces no new Agents SDK type-checking errors beyond the PR base.'
