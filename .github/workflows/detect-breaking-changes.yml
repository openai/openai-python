name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - next
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Run checks for a Release Please branch
        required: false
        default: false
        type: boolean
      base_sha:
        description: Base commit for breaking-change comparison
        required: false
        type: string

permissions:
  contents: read

jobs:
  detect_breaking_changes:
    runs-on: 'ubuntu-latest'
    name: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'next') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/next')) && 'detect-breaking-changes (next)' || 'detect-breaking-changes' }}
    if: github.repository == 'openai/openai-python' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (inputs.release_pr && github.ref == 'refs/heads/release-please--branches--main'))
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || inputs.base_sha }}
      FETCH_DEPTH: 0
    steps:
      - name: Calculate fetch-depth
        if: github.event_name == 'pull_request'
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          echo "FETCH_DEPTH=$((PR_COMMITS + 1))" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Ensure we can check out the pull request base in the script below.
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      - name: Validate comparison baseline
        shell: bash
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid comparison base SHA"; exit 1; }
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Install dependencies
        run: |
          ./scripts/ci-bootstrap
      - name: Detect removed symbols
        run: |
          .venv/bin/python scripts/detect-breaking-changes.py "$BASE_SHA"

      - name: Detect breaking changes
        run: |
          test -f ./scripts/detect-breaking-changes || { echo "Missing scripts/detect-breaking-changes"; exit 1; }
          ./scripts/detect-breaking-changes "$BASE_SHA"
