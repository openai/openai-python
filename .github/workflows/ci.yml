name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Run required CI for a Release Please branch
        required: false
        default: false
        type: boolean
  # Exercise the complete supported matrix and the next CPython prerelease
  # even when the repository has not changed.
  schedule:
    - cron: '47 9 * * *'

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'next') || (github.event_name == 'workflow_dispatch' && inputs.release_pr && github.ref == 'refs/heads/release-please--branches--main') || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install dependencies
        run: ./scripts/ci-bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    if: (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'next') || (github.event_name == 'workflow_dispatch' && inputs.release_pr && github.ref == 'refs/heads/release-please--branches--main') || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install dependencies
        run: ./scripts/ci-bootstrap

      - name: Run build
        run: |
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/build-constraints.txt"
          uv build --build-constraints "$RUNNER_TEMP/build-constraints.txt" --require-hashes

      - name: Validate Python version metadata
        run: .venv/bin/python scripts/utils/validate-python-version-wheel.py

      - name: Validate Bedrock wheel
        run: .venv/bin/python scripts/utils/validate-bedrock-wheel.py

      - name: Validate HTTPX2 wheel on Python 3.10
        run: .venv/bin/python scripts/utils/validate-httpx2-wheel.py

      - name: Set up Python 3.9 for resolver rejection
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Prove Python 3.9 rejects the wheel
        run: python scripts/utils/validate-python-version-wheel.py --check-python-39

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Validate HTTPX2 wheel on Python 3.14
        run: python scripts/utils/validate-httpx2-wheel.py

      - name: Stage tarball for Stainless upload
        if: |-
          github.repository == 'stainless-sdks/openai-python' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stainless-package-tarball
          path: dist/
          if-no-files-found: error
          retention-days: 1

  stainless-upload:
    name: upload tarball to Stainless
    needs: build
    if: github.repository == 'stainless-sdks/openai-python' && !startsWith(github.ref, 'refs/heads/stl/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stainless-package-tarball
          path: dist/

      - name: Get GitHub OIDC Token
        id: github-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: core.setOutput('github_token', await core.getIDToken());

      - name: Upload tarball
        env:
          URL: https://pkg.stainless.com/s
          AUTH: ${{ steps.github-oidc.outputs.github_token }}
          SHA: ${{ github.sha }}
        run: ./scripts/utils/upload-artifact.sh

  test:
    timeout-minutes: 15
    name: test (Python ${{ matrix.python-version }})
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'next') || (github.event_name == 'workflow_dispatch' && inputs.release_pr && github.ref == 'refs/heads/release-please--branches--main') || github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        # Per-PR coverage protects both ends of the support window.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: false

      - name: Select Python ${{ matrix.python-version }}
        run: |
          echo 'UV_PYTHON=${{ steps.setup-python.outputs.python-path }}' >> "$GITHUB_ENV"

      - name: Bootstrap
        run: ./scripts/ci-bootstrap

      - name: Run tests
        run: ./scripts/test

  test-httpx2:
    timeout-minutes: 20
    name: test (HTTPX2)
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'next') || (github.event_name == 'workflow_dispatch' && inputs.release_pr && github.ref == 'refs/heads/release-please--branches--main') || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: false

      - name: Install HTTPX2 test dependencies
        run: |
          UV_PYTHON="${{ steps.setup-python.outputs.python-path }}" ./scripts/ci-bootstrap

      - name: Run tests with HTTPX and HTTPX2 installed
        env:
          OPENAI_TEST_HTTP_CLIENT: httpx
        run: ./scripts/test

      - name: Run tests with HTTPX2
        env:
          OPENAI_TEST_HTTP_CLIENT: httpx2
        run: ./scripts/test

  examples:
    timeout-minutes: 10
    name: examples
    environment: ci
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.repository == 'openai/openai-python' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Install dependencies
        run: |
          ./scripts/ci-bootstrap

      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
            .venv/bin/python examples/demo.py
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
            .venv/bin/python examples/async_demo.py

  python-policy:
    timeout-minutes: 5
    name: Python support policy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check version-policy surfaces
        run: python scripts/check-python-version-policy.py

  compatibility:
    timeout-minutes: 20
    name: compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.release_pr)
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: false

      - name: Select Python ${{ matrix.python-version }}
        run: |
          echo 'UV_PYTHON=${{ steps.setup-python.outputs.python-path }}' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: ./scripts/ci-bootstrap

      - name: Smoke-test the supported runtime
        run: |
          .venv/bin/python -c 'import openai; from openai import AsyncOpenAI, OpenAI'
          .venv/bin/pytest -o addopts= --quiet \
            tests/test_client.py \
            tests/test_streaming.py \
            tests/lib/test_pydantic.py

  ci-required:
    name: ci-required
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'merge_group' ||
       (github.event_name == 'pull_request' && github.base_ref == 'next')) &&
      (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    needs: [lint, build, test, test-httpx2, python-policy]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HTTPX2_RESULT: ${{ needs.test-httpx2.result }}
          POLICY_RESULT: ${{ needs.python-policy.result }}
        run: |
          for result in "$LINT_RESULT" "$BUILD_RESULT" "$TEST_RESULT" "$HTTPX2_RESULT" "$POLICY_RESULT"; do
            if [ "$result" != success ]; then
              echo "Required CI job did not succeed: $result"
              exit 1
            fi
          done
