name: CI
on:
  push:
    branches:
      - '**'
      - '!gh-readonly-queue/**'
      - '!integrated/**'
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  # Exercise the complete supported matrix and the next CPython prerelease
  # even when the repository has not changed.
  schedule:
    - cron: '47 9 * * *'

permissions:
  contents: read

env:
  UV_NO_BUILD: '1'
  UV_NO_BINARY_PACKAGE: 'openai'
  UNTRUSTED_BUILD_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id && '1' || '0' }}
  TRUSTED_BUILD_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

jobs:
  dependency-locks:
    timeout-minutes: 10
    name: dependency lock freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify dependency source provenance before installing tools
        run: |
          python -c 'import ast, os, pathlib, re, subprocess, tomllib; config = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); fork = os.environ.get("UNTRUSTED_BUILD_FORK", "0") == "1"; base = os.environ.get("TRUSTED_BUILD_BASE_SHA", ""); assert not fork or re.fullmatch(r"[0-9a-f]{40}", base), "Untrusted fork build base commit"; assert not fork or subprocess.check_output(["git", "remote", "get-url", "origin"], text=True).strip() in {"https://github.com/openai/openai-python", "https://github.com/openai/openai-python.git"}, "Untrusted fork build base origin"; subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base], check=True) if fork else None; trusted = tomllib.loads(subprocess.check_output(["git", "show", base + ":pyproject.toml"], text=True)) if fork else config; project = config["project"]; lock = tomllib.loads(pathlib.Path("uv.lock").read_text()); roots = [package for package in lock["package"] if package.get("name") == project["name"] and package.get("version") == project["version"] and package.get("source") == {"editable": "."}]; build = config.get("build-system", {}); uv = config.get("tool", {}).get("uv", {}); requires = build.get("requires", []); constraints = uv.get("build-constraint-dependencies", []); reviewed = config.get("dependency-groups", {}).get("build", []); canonical = lambda value: re.sub(r"[-_.]+", "-", value).lower(); normalize = lambda value: re.sub(r"\s+", "", value); identity = lambda value: (canonical((item := re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9_.-]*)\s*==\s*([0-9]+(?:\.[0-9]+)*(?:\.post[0-9]+)?)(?:\s*;\s*(.+))?", value)).group(1)), item.group(2), ast.dump(ast.parse(item.group(3), mode="eval")) if item.group(3) is not None else ""); assert len(roots) == 1 and canonical(project["name"]) == "openai" and sum(canonical(package.get("name", "")) == "openai" for package in lock["package"]) == 1 and all(package is roots[0] or package.get("source") == {"registry": "https://pypi.org/simple"} and isinstance(package.get("wheels"), list) and bool(package.get("wheels")) and (artifacts := ([package["sdist"]] if "sdist" in package else []) + package.get("wheels", [])) and all(isinstance(artifact, dict) and re.fullmatch(r"https://files\.pythonhosted\.org/packages/[^\s?#]+", artifact.get("url", "")) and re.fullmatch(r"sha256:[0-9a-f]{64}", artifact.get("hash", "")) for artifact in artifacts) for package in lock["package"]) and build.get("build-backend") == "hatchling.build" and "backend-path" not in build and isinstance(requires, list) and bool(requires) and isinstance(constraints, list) and bool(constraints) and isinstance(reviewed, list) and bool(reviewed) and not any(uv.get(key) for key in ("sources", "index", "indexes", "index-url", "extra-index-url", "default-index", "find-links", "index_url", "extra_index_url", "default_index", "find_links", "no-binary", "no-binary-package", "no_binary", "no_binary_package")) and not any(pathlib.Path(path).exists() for path in ("uv.toml", ".uv.toml")) and all(isinstance(requirement, str) and (match := re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9_.-]*)\s*==\s*([0-9]+(?:\.[0-9]+)*(?:\.post[0-9]+)?)(?:\s*;\s*(.+))?", requirement)) is not None and (match.group(3) is None or isinstance(marker := ast.parse(match.group(3), mode="eval").body, ast.Compare) and isinstance(marker.left, ast.Name) and len(marker.ops) == 1 and type(marker.ops[0]) in {ast.Eq, ast.NotEq, ast.Lt, ast.LtE, ast.Gt, ast.GtE, ast.In, ast.NotIn} and len(marker.comparators) == 1 and isinstance(marker.comparators[0], ast.Constant) and isinstance(marker.comparators[0].value, str)) and any(canonical(package.get("name", "")) == canonical(match.group(1)) and package.get("version") == match.group(2) and package.get("source") == {"registry": "https://pypi.org/simple"} for package in lock["package"]) for requirement in requires + constraints + reviewed) and {normalize(requirement) for requirement in constraints} == {normalize(requirement) for requirement in reviewed} and {normalize(requirement) for requirement in requires}.issubset({normalize(requirement) for requirement in constraints}) and any(canonical(requirement.split("==", 1)[0].strip()) == "hatchling" for requirement in requires) and build.get("build-backend") == trusted.get("build-system", {}).get("build-backend") and {identity(requirement) for requirement in requires} == {identity(requirement) for requirement in trusted.get("build-system", {}).get("requires", [])} and {identity(requirement) for requirement in constraints} == {identity(requirement) for requirement in trusted.get("tool", {}).get("uv", {}).get("build-constraint-dependencies", [])} and {identity(requirement) for requirement in reviewed} == {identity(requirement) for requirement in trusted.get("dependency-groups", {}).get("build", [])}, "Use only the public PyPI registry, reviewed artifacts, the exact editable root project, and locked reviewed build requirements in uv.lock"'

      - name: Require published minimums for direct security updates
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'dependabot[bot]'
          && contains(github.event.pull_request.head.ref, 'python-security')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import ast
          import io
          import os
          import pathlib
          import re
          import subprocess
          import tomllib
          import tokenize

          base = os.environ.get("BASE_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("Untrusted security-update base commit")
          origin = subprocess.check_output(["git", "remote", "get-url", "origin"], text=True).strip()
          if origin not in {
              "https://github.com/openai/openai-python",
              "https://github.com/openai/openai-python.git",
              "git@github.com:openai/openai-python.git",
              "ssh://git@github.com/openai/openai-python.git",
          }:
              raise SystemExit("Untrusted security-update comparison origin")
          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base], check=True)

          def read_base(path):
              return tomllib.loads(subprocess.check_output(["git", "show", base + ":" + path], text=True))

          def canonical(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def marker_context(marker):
              if not marker.strip():
                  return ()
              try:
                  if any(
                      token.type == tokenize.OP and token.string in {"(", ")"}
                      for token in tokenize.generate_tokens(io.StringIO(marker).readline)
                  ):
                      raise ValueError("Parenthesized security dependency marker")
                  expression = ast.parse(marker.strip(), mode="eval").body
              except (SyntaxError, tokenize.TokenError, ValueError):
                  raise SystemExit("Ambiguous direct security dependency marker")
              if isinstance(expression, ast.BoolOp):
                  if not isinstance(expression.op, ast.And):
                      raise SystemExit("Ambiguous direct security dependency marker")
                  parts = expression.values
              else:
                  parts = [expression]
              result = []
              for part in parts:
                  if (
                      not isinstance(part, ast.Compare)
                      or not isinstance(part.left, ast.Name)
                      or len(part.ops) != 1
                      or len(part.comparators) != 1
                      or not isinstance(part.comparators[0], ast.Constant)
                      or not isinstance(part.comparators[0].value, str)
                      or type(part.ops[0])
                      not in {ast.Eq, ast.NotEq, ast.Lt, ast.LtE, ast.Gt, ast.GtE, ast.In, ast.NotIn}
                  ):
                      raise SystemExit("Ambiguous direct security dependency marker")
                  result.append((part.left.id.lower(), type(part.ops[0]).__name__, part.comparators[0].value))
              return tuple(sorted(result))

          def direct(project, *, protected=False):
              if protected:
                  uv = project.get("tool", {}).get("uv", {})
                  groups = [
                      ("uv-constraint", "", uv.get("constraint-dependencies", [])),
                      ("uv-build-constraint", "", uv.get("build-constraint-dependencies", [])),
                  ]
                  groups.extend(
                      ("dependency-group", canonical(group), requirements)
                      for group, requirements in project.get("dependency-groups", {}).items()
                  )
              else:
                  groups = [("runtime", "", project["project"].get("dependencies", []))]
                  groups.extend(
                      ("optional", canonical(group), requirements)
                      for group, requirements in project["project"].get("optional-dependencies", {}).items()
                  )
              result, contexts = {}, {}
              for scope, group, requirements in groups:
                  for requirement in requirements:
                      match = re.fullmatch(
                          r"\s*([A-Za-z0-9][A-Za-z0-9_.-]*)(\[[^\]]+\])?\s*(.*)", requirement
                      )
                      if match is None:
                          raise SystemExit("Ambiguous direct security dependency requirement")
                      name = canonical(match.group(1))
                      extra = match.group(2)
                      requested = ()
                      if extra:
                          requested = tuple(sorted(canonical(value.strip()) for value in extra[1:-1].split(",")))
                          if any(not re.fullmatch(r"[a-z0-9][a-z0-9-]*", value) for value in requested):
                              raise SystemExit("Ambiguous direct security dependency extras")
                      context = (scope, group, requested, marker_context(match.group(3).partition(";")[2]))
                      normalized = (
                          name + (match.group(2) or "").lower() + re.sub(r"\s+", "", match.group(3)).lower()
                      )
                      result.setdefault(name, set()).add(normalized)
                      contexts.setdefault(name, {}).setdefault(context, set()).add(normalized)
              return result, contexts

          def versions(lock):
              result, contexts = {}, {}
              for package in lock["package"]:
                  name = canonical(package["name"])
                  version = package["version"]
                  result.setdefault(name, set()).add(version)
                  markers = package.get("resolution-markers")
                  if markers is None:
                      domains = [()]
                  else:
                      if not isinstance(markers, list) or not markers or any(
                          not isinstance(marker, str) for marker in markers
                      ):
                          raise SystemExit("Ambiguous locked security dependency resolution marker")
                      domains = [marker_context(marker) for marker in markers]
                  for domain in domains:
                      contexts.setdefault(name, {}).setdefault(domain, set()).add(version)
              return result, contexts

          def stable_version(value):
              match = re.fullmatch(r"(?:(\d+)!)?(\d+(?:\.\d+)*)(?:\.post(\d+))?", value)
              if match is None:
                  raise SystemExit("Unsupported direct security dependency minimum")
              release = tuple(int(part) for part in match.group(2).split("."))
              while release and release[-1] == 0:
                  release = release[:-1]
              post = -1 if match.group(3) is None else int(match.group(3))
              return int(match.group(1) or 0), release, post

          def marker_overlap(requirement, resolution):
              clauses = {}
              for variable, operator, value in requirement + resolution:
                  family = "python" if variable in {"python_version", "python_full_version"} else variable
                  clauses.setdefault(family, []).append((variable, operator, value))
              for family, constraints in clauses.items():
                  if family == "python":
                      lower, upper, excluded = (0, 0, 0), None, []
                      for variable, operator, value in constraints:
                          match = re.fullmatch(r"(\d+)\.(\d+)(?:\.(\d+))?(\.\*)?", value)
                          if match is None or (
                              variable == "python_version" and match.group(3) is not None
                          ):
                              raise SystemExit("Ambiguous Python security dependency marker")
                          major, minor = int(match.group(1)), int(match.group(2))
                          patch = int(match.group(3) or 0)
                          wildcard = match.group(4) is not None
                          if wildcard and operator not in {"Eq", "NotEq"}:
                              raise SystemExit("Ambiguous wildcard security dependency marker")
                          start = (major, minor, patch)
                          stop = (
                              (major, minor + 1, 0)
                              if variable == "python_version" or wildcard
                              else (major, minor, patch + 1)
                          )
                          if operator == "Eq":
                              lower = max(lower, start)
                              upper = stop if upper is None else min(upper, stop)
                          elif operator == "NotEq":
                              excluded.append((start, stop))
                          elif operator == "Lt":
                              upper = start if upper is None else min(upper, start)
                          elif operator == "LtE":
                              upper = stop if upper is None else min(upper, stop)
                          elif operator == "Gt":
                              lower = max(lower, stop)
                          elif operator == "GtE":
                              lower = max(lower, start)
                          else:
                              raise SystemExit("Ambiguous Python security dependency marker")
                      if upper is not None and lower >= upper:
                          return False
                      candidate = lower
                      for start, stop in sorted(excluded):
                          if start <= candidate < stop:
                              candidate = stop
                      if upper is not None and candidate >= upper:
                          return False
                  else:
                      if family not in {
                          "sys_platform",
                          "os_name",
                          "platform_system",
                          "platform_machine",
                          "platform_python_implementation",
                          "implementation_name",
                          "extra",
                      }:
                          raise SystemExit("Unsupported security dependency marker variable")
                      equality, exclusions = None, set()
                      for _, operator, value in constraints:
                          if operator == "Eq":
                              if equality is not None and equality != value:
                                  return False
                              equality = value
                          elif operator == "NotEq":
                              exclusions.add(value)
                          else:
                              raise SystemExit("Ambiguous platform security dependency marker")
                      if equality is not None and equality in exclusions:
                          return False
              return True

          def minimums(requirements, *, allow_missing=False, exact=False):
              result = []
              for requirement in requirements:
                  specifier = requirement.split(";", 1)[0]
                  pattern = (
                      r"(?<![<>=!~])(?:>=|==)([^,;]+)" if exact else r"(?<![<>=!~])>=([^,;]+)"
                  )
                  matches = re.findall(pattern, specifier)
                  if len(matches) != 1:
                      if allow_missing and not matches:
                          continue
                      raise SystemExit("Missing or ambiguous direct security dependency minimum")
                  result.append(stable_version(matches[0].strip()))
              return sorted(result)

          def matches_protected_release(requirements, release, *, upper_only=False):
              for requirement in requirements:
                  expression = requirement.split(";", 1)[0]
                  match = re.fullmatch(
                      r"\s*([A-Za-z0-9][A-Za-z0-9_.-]*)(\[[^\]]+\])?\s*(.*)", expression
                  )
                  if match is None:
                      raise SystemExit("Ambiguous protected security dependency requirement")
                  accepted = True
                  for clause in match.group(3).split(","):
                      if not clause.strip():
                          continue
                      bound = re.fullmatch(r"(>=|<=|==|!=|>|<)\s*(\S+)", clause.strip())
                      if bound is None:
                          raise SystemExit("Ambiguous protected security dependency bound")
                      operator, value = bound.group(1), stable_version(bound.group(2))
                      if upper_only and operator in {">=", ">"}:
                          continue
                      if (
                          operator == ">=" and release < value
                          or operator == ">" and release <= value
                          or operator == "<=" and release > value
                          or operator == "<" and release >= value
                          or operator == "==" and release != value
                          or operator == "!=" and release == value
                      ):
                          accepted = False
                  if accepted:
                      return True
              return False

          def unchanged_nonfloor_bounds(requirement):
              expression = requirement.split(";", 1)[0]
              match = re.fullmatch(
                  r"\s*([A-Za-z0-9][A-Za-z0-9_.-]*)(\[[^\]]+\])?\s*(.*)", expression
              )
              if match is None:
                  raise SystemExit("Ambiguous split security dependency requirement")
              bounds = []
              for clause in match.group(3).split(","):
                  if not clause.strip():
                      continue
                  bound = re.fullmatch(r"(>=|<=|==|!=|>|<)\s*(\S+)", clause.strip())
                  if bound is None:
                      raise SystemExit("Ambiguous split security dependency bound")
                  operator, value = bound.group(1), stable_version(bound.group(2))
                  if operator not in {">=", "=="}:
                      bounds.append((operator, value))
              return tuple(sorted(bounds))

          def replacement_contexts(previous_context, previous_requirements, current_contexts, domains, *, exact=False):
              current = current_contexts.get(previous_context, set())
              if len(current) >= len(previous_requirements):
                  return {previous_context: current}
              if current or previous_context[3] or len(previous_requirements) != 1:
                  return {}
              original = next(iter(previous_requirements))
              original_minimums = minimums(previous_requirements, allow_missing=True, exact=exact)
              if len(original_minimums) != 1:
                  return {}
              replacements = {
                  context: requirements
                  for context, requirements in current_contexts.items()
                  if context[:3] == previous_context[:3] and context[3]
              }
              if len(replacements) < 2:
                  return {}
              for context, requirements in replacements.items():
                  if len(requirements) != 1:
                      return {}
                  replacement = next(iter(requirements))
                  if unchanged_nonfloor_bounds(replacement) != unchanged_nonfloor_bounds(original):
                      return {}
                  replacement_minimums = minimums(requirements, exact=exact)
                  if len(replacement_minimums) != 1 or replacement_minimums[0] < original_minimums[0]:
                      return {}
              relevant = {
                  domain
                  for domain, versions in domains.items()
                  if any(matches_protected_release(previous_requirements, stable_version(version)) for version in versions)
              }
              if len(relevant) < 2:
                  return {}
              covered = set()
              opposite = {"Eq": "NotEq", "NotEq": "Eq", "Lt": "GtE", "LtE": "Gt", "Gt": "LtE", "GtE": "Lt"}
              for domain in relevant:
                  matched = [context for context in replacements if marker_overlap(context[3], domain)]
                  if len(matched) != 1:
                      return {}
                  for variable, operator, value in matched[0][3]:
                      if operator not in opposite or marker_overlap(domain, ((variable, opposite[operator], value),)):
                          return {}
                  covered.add(matched[0])
              return replacements if covered == set(replacements) else {}

          old_project = read_base("pyproject.toml")
          old_lock = read_base("uv.lock")
          new_project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          new_lock = tomllib.loads(pathlib.Path("uv.lock").read_text())
          old_direct, old_contexts = direct(old_project)
          new_direct, new_contexts = direct(new_project)
          old_versions, old_resolution_contexts = versions(old_lock)
          new_versions, new_resolution_contexts = versions(new_lock)
          old_protected, old_protected_contexts = direct(old_project, protected=True)
          new_protected, new_protected_contexts = direct(new_project, protected=True)
          for name, previous in old_protected.items():
              requirements = new_protected.get(name, set())
              previous_contexts = old_protected_contexts.get(name, {})
              current_contexts = new_protected_contexts.get(name, {})
              previous_domains = old_resolution_contexts.get(name, {})
              current_domains = new_resolution_contexts.get(name, {})
              if previous == requirements and previous_contexts == current_contexts and previous_domains == current_domains:
                  continue
              prior_minimums = minimums(previous, allow_missing=True, exact=True)
              if not prior_minimums:
                  continue
              updated_minimums = minimums(requirements, exact=True)
              mapped_contexts = {}
              for context, prior_requirements in previous_contexts.items():
                  context_minimums = minimums(prior_requirements, allow_missing=True, exact=True)
                  if not context_minimums:
                      continue
                  replacements = replacement_contexts(
                      context, prior_requirements, current_contexts, previous_domains, exact=True
                  )
                  if not replacements:
                      raise SystemExit("Do not lower a contextual protected security minimum for " + name)
                  mapped_contexts[context] = replacements
                  for context_requirements in replacements.values():
                      updated_context_minimums = minimums(context_requirements, exact=True)
                      if len(updated_context_minimums) != len(context_minimums) or any(
                          updated < previous for previous, updated in zip(context_minimums, updated_context_minimums)
                      ):
                          raise SystemExit("Do not lower a contextual protected security minimum for " + name)
              split = any(context not in replacements for context, replacements in mapped_contexts.items())
              if split:
                  if set(current_contexts) != {
                      replacement for replacements in mapped_contexts.values() for replacement in replacements
                  }:
                      raise SystemExit("Do not replace a protected security dependency context for " + name)
              elif len(updated_minimums) != len(prior_minimums) or any(
                  updated < previous for previous, updated in zip(prior_minimums, updated_minimums)
              ):
                  raise SystemExit("Do not lower a protected dependency security minimum for " + name)
              if previous_domains == current_domains:
                  continue
              patched_domains = {}
              for domain in previous_domains.keys() | current_domains.keys():
                  prior_versions = previous_domains.get(domain, set())
                  updated_versions = current_domains.get(domain, set())
                  if prior_versions == updated_versions:
                      continue
                  introduced = sorted(stable_version(version) for version in updated_versions - prior_versions)
                  removed = sorted(stable_version(version) for version in prior_versions - updated_versions)
                  if not introduced or len(introduced) != len(removed) or any(
                      updated <= previous for previous, updated in zip(removed, introduced)
                  ):
                      raise SystemExit("Missing contextual upgraded protected security dependency release for " + name)
                  patched_domains[domain] = list(zip(removed, introduced))
              for context, prior_requirements in previous_contexts.items():
                  prior_context_minimums = minimums(prior_requirements, allow_missing=True, exact=True)
                  if not prior_context_minimums:
                      continue
                  for replacement, context_requirements in mapped_contexts[context].items():
                      patched = [
                          introduced
                          for domain, upgrades in patched_domains.items()
                          if marker_overlap(replacement[3], domain)
                          for removed, introduced in upgrades
                          if matches_protected_release(prior_requirements, removed)
                      ]
                      if not patched:
                          continue
                      updated_context_minimums = minimums(context_requirements, exact=True)
                      if (
                          not updated_context_minimums
                          or any(updated < max(patched) for updated in updated_context_minimums)
                          or any(
                              not matches_protected_release(context_requirements, release, upper_only=True)
                              for release in patched
                          )
                      ):
                          raise SystemExit(
                              "Raise the contextual protected security minimum to the patched release for " + name
                          )
          direct_replacements = {}
          for name, previous_contexts in old_contexts.items():
              current_contexts = new_contexts.get(name, {})
              mapped_contexts = {}
              for context, previous_requirements in previous_contexts.items():
                  replacements = replacement_contexts(
                      context, previous_requirements, current_contexts, old_resolution_contexts.get(name, {})
                  )
                  if not replacements:
                      raise SystemExit("Do not remove a published direct dependency or its original context for " + name)
                  mapped_contexts[context] = replacements
              if any(context not in replacements for context, replacements in mapped_contexts.items()) and set(
                  current_contexts
              ) != {replacement for replacements in mapped_contexts.values() for replacement in replacements}:
                  raise SystemExit("Do not replace a published direct dependency context for " + name)
              direct_replacements[name] = mapped_contexts
          for name, requirements in new_direct.items():
              previous = old_direct.get(name, set())
              previous_contexts = old_contexts.get(name, {})
              current_contexts = new_contexts.get(name, {})
              if previous != requirements or previous_contexts != current_contexts:
                  previous_minimums = minimums(previous, allow_missing=True)
                  if previous_minimums:
                      updated_minimums = minimums(requirements)
                      mapped_contexts = direct_replacements.get(name, {})
                      split = any(context not in replacements for context, replacements in mapped_contexts.items())
                      if not split and (
                          len(updated_minimums) != len(previous_minimums)
                          or any(updated < previous for previous, updated in zip(previous_minimums, updated_minimums))
                      ):
                          raise SystemExit("Do not lower a published security-fixed minimum for " + name)
                      for context, prior_requirements in previous_contexts.items():
                          prior_minimums = minimums(prior_requirements, allow_missing=True)
                          if not prior_minimums:
                              continue
                          for context_requirements in mapped_contexts[context].values():
                              context_minimums = minimums(context_requirements)
                              if len(context_minimums) != len(prior_minimums) or any(
                                  updated < previous for previous, updated in zip(prior_minimums, context_minimums)
                              ):
                                  raise SystemExit("Do not lower a contextual security-fixed minimum for " + name)
              previous_domains = old_resolution_contexts.get(name, {})
              current_domains = new_resolution_contexts.get(name, {})
              if (
                  old_versions.get(name, set()) == new_versions.get(name, set())
                  and previous_domains == current_domains
              ):
                  continue
              if previous == requirements:
                  raise SystemExit("Raise the published security-fixed minimum for " + name)
              patched_domains = {}
              for domain in previous_domains.keys() | current_domains.keys():
                  prior_versions = previous_domains.get(domain, set())
                  updated_versions = current_domains.get(domain, set())
                  if prior_versions == updated_versions:
                      continue
                  introduced = sorted(stable_version(version) for version in updated_versions - prior_versions)
                  removed = sorted(stable_version(version) for version in prior_versions - updated_versions)
                  if not introduced or len(introduced) != len(removed) or any(
                      updated <= previous for previous, updated in zip(removed, introduced)
                  ):
                      raise SystemExit("Missing contextual upgraded security dependency release for " + name)
                  patched_domains[domain] = introduced[-1]
              if not patched_domains:
                  raise SystemExit("Missing upgraded direct security dependency release for " + name)
              covered = set()
              for context, context_requirements in current_contexts.items():
                  domains = {
                      domain
                      for domain in patched_domains
                      if marker_overlap(context[3], domain)
                  }
                  if not domains:
                      continue
                  covered.update(domains)
                  patched_minimum = max(patched_domains[domain] for domain in domains)
                  updated_minimums = minimums(context_requirements)
                  original_context = next(
                      (original for original, replacements in direct_replacements.get(name, {}).items()
                       if context in replacements),
                      context,
                  )
                  previous_minimums = minimums(previous_contexts.get(original_context, set()), allow_missing=True)
                  if (
                      not updated_minimums
                      or any(updated < patched_minimum for updated in updated_minimums)
                      or previous_minimums
                      and (
                          len(updated_minimums) != len(previous_minimums)
                          or updated_minimums[0] <= previous_minimums[0]
                      )
                  ):
                      raise SystemExit("Raise the contextual security-fixed minimum for " + name)
              if covered != set(patched_domains):
                  raise SystemExit("Raise the published security-fixed minimum for " + name)
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Verify dependency groups and committed lock
        run: |
          uv run --no-project --python '>=3.11' python -c 'import pathlib, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); assert project["dependency-groups"]["dev"] and "dev" in project["tool"]["uv"]["default-groups"], "Keep the uv development dependency group enabled"'
          uv run --no-project --python '>=3.11' python -c 'import pathlib, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); text = pathlib.Path("uv.lock").read_text(); lock = tomllib.loads(text); version = project["project"]["version"]; assert next(package["version"] for package in lock["package"] if package["name"] == "openai") == version and "version = " + chr(34) + version + chr(34) + " # x-release-please-version" in text, "Preserve the uv.lock release-please marker and project version"'
          uv lock --check

  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-tooling

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run lints
        run: ./scripts/lint

  build:
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run build
        run: |
          external_packages="$(python -c 'import importlib, re, sys; parser = importlib.import_module("tomllib" if sys.version_info >= (3, 11) else "tomli"); packages = parser.loads(open("uv.lock").read())["package"]; roots = [package for package in packages if package.get("source") == {"editable": "."}]; external = [package for package in packages if package not in roots]; assert len(roots) == 1 and roots[0].get("name") == "openai" and external and all(package.get("source") == {"registry": "https://pypi.org/simple"} and isinstance(package.get("name"), str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", package["name"]) for package in external), "Refuse malformed external build package restrictions"; denied = sorted({re.sub(r"[-_.]+", "-", package["name"]).lower() for package in external}); assert denied and "openai" not in denied, "Refuse incomplete external build package restrictions"; print(" ".join(denied))')"
          env -u UV_NO_BUILD UV_NO_BUILD_PACKAGE="$external_packages" ./scripts/build

      - name: Validate Python version metadata
        run: uv run --locked --all-extras python scripts/utils/validate-python-version-wheel.py

      - name: Validate Bedrock wheel
        run: uv run --locked --all-extras python scripts/utils/validate-bedrock-wheel.py

      - name: Validate HTTPX2 wheel on Python 3.10
        run: uv run --locked --all-extras python scripts/utils/validate-httpx2-wheel.py

      - name: Set up Python 3.9 for resolver rejection
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Prove Python 3.9 rejects the wheel
        run: python scripts/utils/validate-python-version-wheel.py --check-python-39

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Validate HTTPX2 wheel on Python 3.14
        run: python scripts/utils/validate-httpx2-wheel.py

  test:
    timeout-minutes: 15
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        # Per-PR coverage protects both ends of the support window.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-tooling

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test

  test-httpx2:
    timeout-minutes: 20
    name: test (HTTPX2)
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-tooling

      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: '3.14'
          enable-cache: true

      - name: Install HTTPX2 test dependencies
        run: |
          uv sync --locked --all-extras

      - name: Run tests with HTTPX2
        env:
          OPENAI_TEST_HTTP_CLIENT: httpx2
        run: ./scripts/test

  examples:
    timeout-minutes: 10
    name: examples
    environment: ci
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.repository == 'openai/openai-python' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --all-extras

      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
            uv run --locked --all-extras python examples/demo.py
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
            uv run --locked --all-extras python examples/async_demo.py

  python-policy:
    timeout-minutes: 5
    name: Python support policy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check version-policy surfaces
        run: python scripts/check-python-version-policy.py

  compatibility:
    timeout-minutes: 20
    name: compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: ${{ matrix.experimental }}
    env:
      UV_NO_BUILD: ${{ matrix.experimental && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '0' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Smoke-test the supported runtime
        run: |
          uv run --locked --all-extras python -c 'import openai; from openai import AsyncOpenAI, OpenAI'
          uv run --locked --all-extras pytest -o addopts= --quiet \
            tests/test_client.py \
            tests/test_streaming.py \
            tests/lib/test_pydantic.py
