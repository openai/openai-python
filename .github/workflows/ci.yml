name: CI
on:
  push:
    branches:
      - '**'
      - '!gh-readonly-queue/**'
      - '!integrated/**'
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  # Exercise the complete supported matrix and the next CPython prerelease
  # even when the repository has not changed.
  schedule:
    - cron: '47 9 * * *'

permissions:
  contents: read

jobs:
  dependency-locks:
    timeout-minutes: 10
    name: dependency lock freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify dependency source provenance before installing tools
        run: |
          python -c 'import pathlib, re, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]; lock = tomllib.loads(pathlib.Path("uv.lock").read_text()); roots = [package for package in lock["package"] if package.get("name") == project["name"] and package.get("version") == project["version"] and package.get("source") == {"editable": "."}]; assert len(roots) == 1 and all(package is roots[0] or package.get("source") == {"registry": "https://pypi.org/simple"} and isinstance(package.get("wheels", []), list) and (artifacts := ([package["sdist"]] if "sdist" in package else []) + package.get("wheels", [])) and all(isinstance(artifact, dict) and re.fullmatch(r"https://files\.pythonhosted\.org/packages/[^\s?#]+", artifact.get("url", "")) and re.fullmatch(r"sha256:[0-9a-f]{64}", artifact.get("hash", "")) for artifact in artifacts) for package in lock["package"]), "Use only the public PyPI registry, reviewed artifacts, and the exact editable root project in uv.lock"'

      - name: Require published minimums for direct security updates
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'dependabot[bot]'
          && contains(github.event.pull_request.head.ref, 'python-security')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          base = os.environ.get("BASE_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("Untrusted security-update base commit")
          origin = subprocess.check_output(["git", "remote", "get-url", "origin"], text=True).strip()
          if origin not in {
              "https://github.com/openai/openai-python",
              "https://github.com/openai/openai-python.git",
              "git@github.com:openai/openai-python.git",
              "ssh://git@github.com/openai/openai-python.git",
          }:
              raise SystemExit("Untrusted security-update comparison origin")
          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base], check=True)

          def read_base(path):
              return tomllib.loads(subprocess.check_output(["git", "show", base + ":" + path], text=True))

          def canonical(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def direct(project):
              requirements = list(project["project"].get("dependencies", []))
              for group in project["project"].get("optional-dependencies", {}).values():
                  requirements.extend(group)
              result = {}
              for requirement in requirements:
                  match = re.fullmatch(r"\s*([A-Za-z0-9][A-Za-z0-9_.-]*)(\[[^\]]+\])?\s*(.*)", requirement)
                  if match is None:
                      raise SystemExit("Ambiguous direct security dependency requirement")
                  name = canonical(match.group(1))
                  normalized = name + (match.group(2) or "").lower() + re.sub(r"\s+", "", match.group(3)).lower()
                  result.setdefault(name, set()).add(normalized)
              return result

          def versions(lock):
              result = {}
              for package in lock["package"]:
                  result.setdefault(canonical(package["name"]), set()).add(package["version"])
              return result

          def stable_version(value):
              match = re.fullmatch(r"(?:(\d+)!)?(\d+(?:\.\d+)*)", value)
              if match is None:
                  raise SystemExit("Unsupported direct security dependency minimum")
              release = tuple(int(part) for part in match.group(2).split("."))
              while release and release[-1] == 0:
                  release = release[:-1]
              return int(match.group(1) or 0), release

          def minimums(requirements, *, allow_missing=False):
              result = []
              for requirement in requirements:
                  specifier = requirement.split(";", 1)[0]
                  matches = re.findall(r"(?<![<>=!~])>=([^,;]+)", specifier)
                  if len(matches) != 1:
                      if allow_missing and not matches:
                          continue
                      raise SystemExit("Missing or ambiguous direct security dependency minimum")
                  result.append(stable_version(matches[0].strip()))
              return sorted(result)

          old_project = read_base("pyproject.toml")
          old_lock = read_base("uv.lock")
          new_project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          new_lock = tomllib.loads(pathlib.Path("uv.lock").read_text())
          old_direct, new_direct = direct(old_project), direct(new_project)
          old_versions, new_versions = versions(old_lock), versions(new_lock)
          for name, requirements in new_direct.items():
              previous = old_direct.get(name, set())
              if previous != requirements:
                  previous_minimums = minimums(previous, allow_missing=True)
                  if previous_minimums:
                      updated_minimums = minimums(requirements)
                      if len(updated_minimums) != len(previous_minimums) or any(
                          updated < previous for previous, updated in zip(previous_minimums, updated_minimums)
                      ):
                          raise SystemExit("Do not lower a published security-fixed minimum for " + name)
              if old_versions.get(name, set()) == new_versions.get(name, set()):
                  continue
              if previous == requirements:
                  raise SystemExit("Raise the published security-fixed minimum for " + name)
              patched_versions = new_versions.get(name, set()) - old_versions.get(name, set())
              if not patched_versions:
                  raise SystemExit("Missing patched direct security dependency release for " + name)
              patched_minimum = max(stable_version(version) for version in patched_versions)
              updated_minimums = minimums(requirements)
              previous_minimums = minimums(previous, allow_missing=True)
              if not updated_minimums or any(updated < patched_minimum for updated in updated_minimums) or (
                  previous_minimums
                  and (
                      len(updated_minimums) != len(previous_minimums)
                      or any(updated < previous for previous, updated in zip(previous_minimums, updated_minimums))
                      or updated_minimums[0] <= previous_minimums[0]
                  )
              ):
                  raise SystemExit("Raise the published security-fixed minimum for " + name)
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Verify dependency groups and committed lock
        run: |
          uv run --no-project --python '>=3.11' python -c 'import pathlib, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); assert project["dependency-groups"]["dev"] and "dev" in project["tool"]["uv"]["default-groups"], "Keep the uv development dependency group enabled"'
          uv run --no-project --python '>=3.11' python -c 'import pathlib, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); text = pathlib.Path("uv.lock").read_text(); lock = tomllib.loads(text); version = project["project"]["version"]; assert next(package["version"] for package in lock["package"] if package["name"] == "openai") == version and "version = " + chr(34) + version + chr(34) + " # x-release-please-version" in text, "Preserve the uv.lock release-please marker and project version"'
          uv lock --check

  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-tooling

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run lints
        run: ./scripts/lint

  build:
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run build
        run: ./scripts/build

      - name: Validate Python version metadata
        run: uv run --locked --all-extras python scripts/utils/validate-python-version-wheel.py

      - name: Validate Bedrock wheel
        run: uv run --locked --all-extras python scripts/utils/validate-bedrock-wheel.py

      - name: Validate HTTPX2 wheel on Python 3.10
        run: uv run --locked --all-extras python scripts/utils/validate-httpx2-wheel.py

      - name: Set up Python 3.9 for resolver rejection
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Prove Python 3.9 rejects the wheel
        run: python scripts/utils/validate-python-version-wheel.py --check-python-39

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Validate HTTPX2 wheel on Python 3.14
        run: python scripts/utils/validate-httpx2-wheel.py

  test:
    timeout-minutes: 15
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        # Per-PR coverage protects both ends of the support window.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-tooling

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test

  test-httpx2:
    timeout-minutes: 20
    name: test (HTTPX2)
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-tooling

      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: '3.14'
          enable-cache: true

      - name: Install HTTPX2 test dependencies
        run: |
          uv sync --locked --all-extras

      - name: Run tests with HTTPX2
        env:
          OPENAI_TEST_HTTP_CLIENT: httpx2
        run: ./scripts/test

  examples:
    timeout-minutes: 10
    name: examples
    environment: ci
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.repository == 'openai/openai-python' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --all-extras

      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
            uv run --locked --all-extras python examples/demo.py
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
            uv run --locked --all-extras python examples/async_demo.py

  python-policy:
    timeout-minutes: 5
    name: Python support policy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check version-policy surfaces
        run: python scripts/check-python-version-policy.py

  compatibility:
    timeout-minutes: 20
    name: compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: dependency-locks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Smoke-test the supported runtime
        run: |
          uv run --locked --all-extras python -c 'import openai; from openai import AsyncOpenAI, OpenAI'
          uv run --locked --all-extras pytest -o addopts= --quiet \
            tests/test_client.py \
            tests/test_streaming.py \
            tests/lib/test_pydantic.py
