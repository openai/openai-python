# Handwritten Python-only rollout; intentionally not generated by Castiron.
name: Custom-code budget

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: custom-code-budget-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Custom-code budget tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out unprivileged PR tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline reporter and budget regressions
        run: python3 -m unittest discover -s scripts/castiron -p 'test_custom_code*.py'

  evaluate:
    name: Evaluate trusted custom-code budget
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base-sha: ${{ steps.check.outputs.base_sha }}
      head-sha: ${{ steps.check.outputs.head_sha }}
      isolation: ${{ steps.check.outputs.isolation }}
      budget: ${{ steps.check.outputs.budget }}
    steps:
      - name: Check out trusted main, never the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Inspect candidate Git objects with main's checker and policy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        run: |
          trusted_sha=$(git rev-parse HEAD)
          python3 -I scripts/castiron/custom_code_budget.py github \
            --repository "$REPOSITORY" --event-name "$EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" --trusted-sha "$trusted_sha" \
            --repo "$RUNNER_TEMP/budget-objects.git" \
            --out "$RUNNER_TEMP/custom-code-budget"

      - name: Add the trusted report to the run summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/custom-code-budget/summary.md"; then
            cat "$RUNNER_TEMP/custom-code-budget/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload trusted measurements and patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-code-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/custom-code-budget/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish budget checks on the candidate
    needs: evaluate
    if: always() && !cancelled() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # No checkout, PR code, or PR-produced artifacts in the write-capable job.
      - name: Publish exact-head statuses after checking freshness
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BASE_SHA: ${{ needs.evaluate.outputs.base-sha }}
          HEAD_SHA: ${{ needs.evaluate.outputs.head-sha }}
          ISOLATION_RESULT: ${{ needs.evaluate.outputs.isolation }}
          BUDGET_RESULT: ${{ needs.evaluate.outputs.budget }}
          EVALUATION_RESULT: ${{ needs.evaluate.result }}
        with:
          script: |
            let head;
            let base;
            if (context.eventName === 'pull_request_target') {
              const event = context.payload.pull_request;
              const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: event.number});
              if (current.state !== 'open' || current.head.sha !== event.head.sha) return;
              if (current.base.ref !== 'main' || current.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
              head = current.head.sha;
              base = current.base.sha;
            } else {
              head = context.payload.merge_group.head_sha;
              const {data: main} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
              base = main.object.sha;
            }
            if (!/^[0-9a-f]{40}$/.test(head)) throw new Error('Invalid candidate SHA');
            const fresh = base === process.env.BASE_SHA && head === process.env.HEAD_SHA;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const [name, result] of [
              ['Castiron / budget-only change', process.env.ISOLATION_RESULT],
              ['Castiron / custom-code budget', process.env.BUDGET_RESULT],
            ]) {
              const state = fresh && result === 'success' && process.env.EVALUATION_RESULT !== 'cancelled' ? 'success' : 'failure';
              const description = !fresh ? 'Evaluation unavailable or base changed; rerun against current main.'
                : state === 'success' ? 'Passed against main policy. See the trusted run summary.'
                : 'Budget check failed. See the trusted run summary.';
              await github.rest.repos.createCommitStatus({...context.repo, sha: head, context: name,
                state, description, target_url: url});
            }
