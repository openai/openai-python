version: 2

# Cooldowns apply only to routine version updates; security fixes stay prompt.
updates:
  # Dependabot supports pyproject.toml but cannot update Rye-generated locks.
  # Before merging a Python update, regenerate requirements.lock and
  # requirements-dev.lock with `rye lock --all-features`, then run `uv lock`.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 8
    open-pull-requests-limit: 3
    groups:
      python-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 8
    open-pull-requests-limit: 5
    groups:
      # CodeQL init/analyze share versioned state and must change together.
      codeql:
        patterns:
          - "github/codeql-action/*"
