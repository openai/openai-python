<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="580" viewBox="0 0 1320 580" role="img" aria-labelledby="title desc">
  <title id="title">JSON serializer benchmark distributions</title>
  <desc id="desc">Paired stdlib JSON and orjson distributions for three encoded payload sizes. Boxes show the interquartile range, horizontal lines show the median, whiskers show minimum and maximum, and dots show the mean.</desc>
  <style>
    svg { background: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #f0f6fc; font-size: 25px; font-weight: 700; }
    .subtitle, .detail, .axis { fill: #8b949e; font-size: 13px; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .panel-title { fill: #f0f6fc; font-size: 16px; font-weight: 700; }
    .speedup { fill: #34d399; font-size: 15px; font-weight: 700; }
    .grid { stroke: #30363d; stroke-width: 1; stroke-dasharray: 3 5; }
    .whisker { stroke: currentColor; stroke-width: 1.5; }
    .series { font-size: 14px; font-weight: 700; }
    .stdlib { fill: #60a5fa; }
    .orjson { fill: #34d399; }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" />
  <text x="40" y="48" class="title">Request-body JSON serialization distribution</text>
  <text x="40" y="74" class="subtitle">Box = interquartile range · line = median · whiskers = min/max · dot = mean</text>
  <rect x="985" y="37" width="14" height="14" rx="3" fill="#60a5fa" />
  <text x="1007" y="49" class="subtitle">stdlib json</text>
  <rect x="1130" y="37" width="14" height="14" rx="3" fill="#34d399" />
  <text x="1152" y="49" class="subtitle">orjson</text>
  <rect x="90.0" y="122" width="370" height="350" rx="10" class="panel" />
<text x="108.0" y="150.0" class="panel-title" text-anchor="start">18 KB encoded payload</text>
<text x="442.0" y="150.0" class="speedup" text-anchor="end">2.64x faster</text>
<line x1="90.0" y1="438.0" x2="460.0" y2="438.0" class="grid" />
<text x="82.0" y="442.0" class="axis" text-anchor="end">18.2 us</text>
<line x1="90.0" y1="368.0" x2="460.0" y2="368.0" class="grid" />
<text x="82.0" y="372.0" class="axis" text-anchor="end">30.5 us</text>
