<circle cx="752.0" cy="409.4" r="5" fill="#34d399" stroke="currentColor" stroke-width="1.5" />
<text x="598.0" y="466.0" class="series stdlib" text-anchor="middle">stdlib json</text>
<text x="752.0" y="466.0" class="series orjson" text-anchor="middle">orjson</text>
