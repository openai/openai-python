<text x="362.0" y="466.0" class="series orjson" text-anchor="middle">orjson</text>
<text x="208.0" y="488.0" class="detail" text-anchor="middle">median 61.2 us</text>
<text x="362.0" y="488.0" class="detail" text-anchor="middle">median 23.2 us</text>
