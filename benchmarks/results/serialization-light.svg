    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .panel-title { fill: #0f172a; font-size: 16px; font-weight: 700; }
    .speedup { fill: #16a34a; font-size: 15px; font-weight: 700; }
